<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d18">
<meta name="description" content="گەڕان و بینین و داگرتنی ڤیدیۆی یوتیوب بە کوردی">
<title>یوتیوب | گەڕان و داگرتن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
:root{color-scheme:dark;--bg:#080c16;--panel:#111827;--line:#26334a;--text:#f5f7ff;--muted:#9ba9bf;--blue:#6685ff;--cyan:#4bd5d0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#273b7b55,transparent 40%),var(--bg);color:var(--text);font-family:"Noto Sans Arabic",sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto}.top{border-bottom:1px solid #ffffff12;background:#080c16dd;backdrop-filter:blur(16px)}.nav{height:72px;display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#526ff0,#7959e8);font-size:19px}.brand{font-weight:900;font-size:21px}.hero{text-align:center;padding:42px 0 25px}.hero h1{font-size:clamp(28px,6vw,45px);margin:0 0 10px;font-weight:900}.grad{background:linear-gradient(90deg,#8ba4ff,#54ddd2);background-clip:text;color:transparent}.hero p{color:var(--muted);line-height:1.9;margin:0}.panel{background:linear-gradient(145deg,#151f31,#101827);border:1px solid var(--line);border-radius:23px;padding:clamp(17px,4vw,27px);box-shadow:0 18px 55px #0006}.search{display:flex;gap:10px}.field{flex:1;min-width:0;background:#090f1c;border:1px solid #2a3952;border-radius:15px;padding:15px;color:white;font:inherit;outline:none}.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px #6685ff22}.btn{border:0;border-radius:15px;padding:13px 20px;color:white;font:inherit;font-weight:800;background:linear-gradient(135deg,#526ff0,#7959e8);cursor:pointer}.btn:disabled{opacity:.55}.note{font-size:13px;color:var(--muted);line-height:1.9;margin:13px 2px 0}.loader{display:none;align-items:center;justify-content:center;gap:10px;padding:22px;color:#c8d2e4}.loader.show{display:flex}.spin{width:19px;height:19px;border:2px solid #52617b;border-top-color:#8ca3ff;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:18px}.video{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#0d1422}.thumb{aspect-ratio:16/9;background:#1b2940;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.play{position:absolute;inset:0;margin:auto;width:52px;height:52px;border:0;border-radius:50%;background:white;color:#111827}.meta{padding:13px}.title{font-weight:800;line-height:1.6}.sub{font-size:12px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;padding:10px 6px;font-size:13px}.secondary{background:#1d2a40;border:1px solid var(--line)}.empty{margin-top:17px;border:1px dashed #3a4b68;border-radius:15px;padding:22px;text-align:center;color:var(--muted);line-height:1.9}.formats{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:14px}.format{border:1px solid #40537a;background:#1b2a43;color:white;padding:10px 13px;border-radius:12px;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:10;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modalbox{width:min(850px,100%);background:#111827;border:1px solid var(--line);border-radius:18px;overflow:hidden}.modalhead{padding:12px 16px;display:flex;justify-content:space-between}.close{background:#26334a;border:0;color:white;border-radius:9px;width:35px;font-size:22px}.player{aspect-ratio:16/9;background:#000}.player iframe{width:100%;height:100%;border:0}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#f5f7ff;color:#111827;padding:12px 18px;border-radius:12px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}footer{text-align:center;padding:30px 0;color:#71809a;font-size:12px}@media(max-width:600px){.search{flex-direction:column}.search .btn{width:100%}.grid{grid-template-columns:1fr}.hero{padding-top:32px}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><span class="logo"><i class="fa-brands fa-youtube"></i></span><span class="brand">یوتیوبی کوردی</span></div></header>
<main class="wrap">
<section class="hero"><h1>گەڕان و <span class="grad">داگرتنی ڤیدیۆ</span></h1><p>ناوی ڤیدیۆکە بنووسە، ئەنجامەکان ببینە و فۆرماتی بەردەست هەڵبژێرە.</p></section>
<section class="panel"><div class="search"><input id="query" class="field" type="search" placeholder="ناوی گۆرانی یان ڤیدیۆ بنووسە..." autocomplete="off"><button class="btn" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i> گەڕان</button></div><p class="note">هیچ ڤیدیۆیەک بە شێوەی خۆکار پیشان نادرێت. تەنها ئەو ئەنجامانە دەردەکەون کە خۆت داوایان دەکەیت.</p></section>
<div id="loader" class="loader"><span class="spin"></span> گەڕان لە یوتیوب...</div><section id="results" class="grid" aria-live="polite"></section><section id="formats"></section>
</main>
<footer class="wrap">© <span id="year"></span> یوتیوبی کوردی</footer>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><b id="modalTitle">بینینی ڤیدیۆ</b><button class="close" id="close">×</button></div><div class="player" id="player"></div></div></div><div id="toast" class="toast"></div>
<script>
/* API configuration: keep your existing key value in this declaration when replacing the file. */
const RAPID_KEY='3a6008168fmshc89e2b9e019262ap1db9f8jsne1aad62d8bff';
const HEADERS={'X-RapidAPI-Key':RAPID_KEY,'X-RapidAPI-Host':'yt-api.p.rapidapi.com'};
const $=id=>document.getElementById(id);
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2800)}
function loading(v){$('loader').classList.toggle('show',v);$('searchBtn').disabled=v}
async function request(url){const r=await fetch(url,{headers:HEADERS,cache:'no-store'});const x=await r.json();if(!r.ok||x?.error)throw Error(x?.message||'API error');return x}
function play(id,title){$('modalTitle').textContent=title||'بینینی ڤیدیۆ';$('player').innerHTML=`<iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&playsinline=1" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;$('modal').classList.add('show')}
function close(){ $('modal').classList.remove('show');$('player').replaceChildren() }
$('close').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function card(v){const a=document.createElement('article');a.className='video';const t=document.createElement('div');t.className='thumb';const im=document.createElement('img');im.loading='lazy';im.src=v.thumbnail?.[0]?.url||`https://i.ytimg.com/vi/${encodeURIComponent(v.videoId)}/hqdefault.jpg`;im.alt='پێشبینینی ڤیدیۆ';const p=document.createElement('button');p.className='play';p.innerHTML='<i class="fa-solid fa-play"></i>';p.onclick=()=>play(v.videoId,v.title);t.append(im,p);const m=document.createElement('div');m.className='meta';const title=document.createElement('div');title.className='title';title.textContent=v.title||'ڤیدیۆ';const sub=document.createElement('div');sub.className='sub';sub.textContent=v.channelTitle||v.author||'YouTube';const actions=document.createElement('div');actions.className='actions';const watch=document.createElement('button');watch.className='btn secondary';watch.textContent='بینین';watch.onclick=()=>play(v.videoId,v.title);const dl=document.createElement('button');dl.className='btn';dl.textContent='فۆرماتی داگرتن';dl.onclick=()=>formats(v.videoId);actions.append(watch,dl);m.append(title,sub,actions);a.append(t,m);return a}
async function search(){const q=$('query').value.trim();if(!q)return toast('تکایە ناوی ڤیدیۆکە بنووسە');$('results').replaceChildren();$('formats').replaceChildren();loading(true);try{const x=await request('https://yt-api.p.rapidapi.com/search?type=video&query='+encodeURIComponent(q));const vs=Array.isArray(x.data)?x.data.filter(v=>v?.videoId):[];if(!vs.length){$('results').innerHTML='<div class="empty">هیچ ئەنجامێک نەدۆزرایەوە.</div>';return}vs.slice(0,18).forEach(v=>$('results').append(card(v)))}catch(e){$('results').innerHTML='<div class="empty">گەڕان سەرکەوتوو نەبوو. کلیل و بەشداریی API بپشکنە.</div>';toast('کێشەیەک لە گەڕاندا هەیە')}finally{loading(false)}}
async function formats(id){loading(true);$('formats').replaceChildren();try{const x=await request('https://yt-api.p.rapidapi.com/dl?id='+encodeURIComponent(id));const box=document.createElement('div');box.className='empty';const h=document.createElement('b');h.textContent=x.title||'فۆرماتە بەردەستەکان';const list=document.createElement('div');list.className='formats';const seen=new Set();function add(label,url){if(!url||seen.has(url))return;seen.add(url);const b=document.createElement('button');b.className='format';b.textContent=label;b.onclick=()=>window.open(url,'_blank','noopener,noreferrer');list.append(b)}(x.formats||[]).forEach(f=>add((f.qualityLabel||f.quality||'ڤیدیۆ')+' MP4',f.url));(x.adaptiveFormats||[]).filter(f=>f.url&&(f.mimeType||'').includes('audio')).forEach(f=>add((f.audioQuality||f.quality||'دەنگ')+' Audio',f.url));box.append(h,list);$('formats').append(box);if(!seen.size)throw Error('no formats')}catch(e){toast('فۆرماتی داگرتن بەردەست نییە')}finally{loading(false)}}
$('searchBtn').onclick=search;$('query').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('year').textContent=new Date().getFullYear();
</script>
</body>
</html>
